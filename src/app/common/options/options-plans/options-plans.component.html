<div class="w-full flex justify-end h-0 p-2 z-20 relative">
  
    <div class="relative text-left">
      
      <button 
        (click)="toggleMenu()" 
        type="button" 
        class="bg-white/90 backdrop-blur-sm rounded-full p-2 hover:bg-gray-100 shadow-sm transition-colors border border-gray-100"
        aria-label="Opciones">
        
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z" />
        </svg>
      </button>
    
      @if (isMenuOpen) {
        <div 
          class="origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 z-50 focus:outline-none" 
          role="menu">
          
          <div class="py-1">
            <button 
              (click)="onUpdate()"
              class="text-gray-700 hover:bg-gray-100 hover:text-blue-600 group flex items-center px-4 py-2 text-sm w-full text-left">
              <svg class="mr-3 h-5 w-5 text-gray-400 group-hover:text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
              </svg>
              {{ 'plans.update' | translate }}
            </button>
    
            <button 
              (click)="askToDelete()" 
              class="text-red-600 hover:bg-red-50 hover:text-red-900 group flex items-center px-4 py-2 text-sm w-full text-left">
              <svg class="mr-3 h-5 w-5 text-red-400 group-hover:text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
              {{ 'plans.delete' | translate }}
            </button>
          </div>
        </div>
      }
      
      @if (isMenuOpen) {
        <div (click)="isMenuOpen = false" class="fixed inset-0 z-40 bg-transparent cursor-default"></div>
      }
    </div>
  
    @if (showDeleteModal){
      <div class="fixed inset-0 z-[100] overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        
        <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity"></div>
  
        <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
          
          <div class="relative transform overflow-hidden rounded-lg bg-white text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg border border-gray-200">
            
            <div class="bg-white px-4 pb-4 pt-5 sm:p-6 sm:pb-4">
              <div class="sm:flex sm:items-start">
                
                <div class="mx-auto flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full bg-red-100 sm:mx-0 sm:h-10 sm:w-10">
                  <svg class="h-6 w-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                  </svg>
                </div>
                
                <div class="mt-3 text-center sm:ml-4 sm:mt-0 sm:text-left">
                  <h3 class="text-base font-semibold leading-6 text-gray-900" id="modal-title">{{ 'plans.delete' | translate }}</h3>
                  <div class="mt-2">
                    <p class="text-sm text-gray-500">{{ 'plans.deleteConfirm' | translate }}</p>
                  </div>
                </div>
              </div>
            </div>
  
            <div class="bg-gray-50 px-4 py-3 sm:flex sm:flex-row-reverse sm:px-6">
              <button 
                (click)="confirmDelete()" 
                type="button" 
                class="inline-flex w-full justify-center rounded-md bg-red-600 px-3 py-2 text-sm font-semibold text-white shadow-sm hover:bg-red-500 sm:ml-3 sm:w-auto transition-colors">
                {{ 'activities.yesDelete' | translate }}
              </button>
              <button 
                (click)="cancelDelete()" 
                type="button" 
                class="mt-3 inline-flex w-full justify-center rounded-md bg-white px-3 py-2 text-sm font-semibold text-gray-900 shadow-sm ring-1 ring-inset ring-gray-300 hover:bg-gray-50 sm:mt-0 sm:w-auto transition-colors">
                {{ 'plans.cancel' | translate }}
              </button>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
