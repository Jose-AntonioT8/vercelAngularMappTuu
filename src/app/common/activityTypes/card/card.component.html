<section class="group relative rounded-2xl shadow hover:shadow-lg transition-all duration-300 overflow-hidden w-full cursor-pointer bg-white">
  <button class="block w-full text-left" (click)="redirectToDetail()">
    <div class="p-4 flex items-center gap-3">
      <div
        *ngIf="activityTypeColor"
        class="w-6 h-6 rounded-full border border-gray-200 flex-shrink-0"
        [style.background-color]="activityTypeColor">
      </div>
      <h3 class="text-base sm:text-lg font-semibold text-gray-900">
        {{ activityType.name }}
      </h3>
    </div>
  </button>
</section>
