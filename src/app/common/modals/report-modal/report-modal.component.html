<div
  *ngIf="isOpen"
  class="fixed inset-0 z-[1200] bg-black/50 flex items-center justify-center p-4"
  (click)="closeModal()"
>
  <div
    class="w-full max-w-lg bg-white rounded-2xl shadow-xl p-6"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-start justify-between mb-4">
      <div>
        <h3 class="text-xl font-bold text-gray-900">
          {{ 'reports.reportActivity.modalTitle' | translate }}
        </h3>
        <p class="text-sm text-gray-500" *ngIf="activityName">
          {{ activityName }}
        </p>
      </div>
      <button
        type="button"
        class="text-gray-500 hover:text-gray-700"
        (click)="closeModal()"
      >
        &times;
      </button>
    </div>

    <div class="space-y-4">
      <label class="block">
        <span class="text-sm font-medium text-gray-700">{{
          'reports.reportActivity.reasonLabel' | translate
        }}</span>
        <select
          [(ngModel)]="reason"
          class="mt-1 w-full rounded-lg border border-gray-300 p-2.5"
        >
          <option *ngFor="let option of reasonOptions" [value]="option.value">
            {{ option.labelKey | translate }}
          </option>
        </select>
      </label>

      <label class="block">
        <span class="text-sm font-medium text-gray-700">{{
          'reports.reportActivity.detailLabel' | translate
        }}</span>
        <textarea
          [(ngModel)]="details"
          rows="4"
          maxlength="500"
          class="mt-1 w-full rounded-lg border border-gray-300 p-2.5"
          [placeholder]="'reports.reportActivity.detailPlaceholder' | translate"
        ></textarea>
        <span class="text-xs text-gray-500">{{ details.length }}/500</span>
      </label>

      <p *ngIf="errorKey" class="text-sm text-red-600">
        {{ errorKey | translate }}
      </p>
    </div>

    <div class="mt-6 flex justify-end gap-3">
      <button
        type="button"
        class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-50"
        (click)="closeModal()"
      >
        {{ 'common.cancel' | translate }}
      </button>
      <button
        type="button"
        class="px-4 py-2 rounded-lg bg-[#5675AC] text-white hover:bg-[#4a6399]"
        (click)="submitReport()"
      >
        {{ 'reports.reportActivity.submit' | translate }}
      </button>
    </div>
  </div>
</div>
