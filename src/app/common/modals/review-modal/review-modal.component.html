<div
  *ngIf="isOpen"
  class="fixed inset-0 bg-black/50 flex items-center justify-center z-[1000] p-4"
>
  <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full animate-fade-in">
    <!-- Header -->
    <div
      class="px-6 py-4 border-b border-gray-200 flex justify-between items-center"
    >
      <h2 class="text-xl font-bold text-gray-900">
        <ng-container *ngIf="isEditMode">
          {{ "activities.editReview" | translate }}
        </ng-container>
        <ng-container *ngIf="!isEditMode">
          {{ "activities.writeReview" | translate }}
        </ng-container>
      </h2>
      <button
        (click)="closeModal()"
        [disabled]="isSubmitting"
        class="text-gray-500 hover:text-gray-700 transition-colors disabled:opacity-50"
      >
        <svg
          class="w-6 h-6"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <div class="px-6 py-6">
      <!-- Error Message -->
      <div
        *ngIf="error"
        class="mb-4 p-3 bg-red-50 border border-red-200 rounded-lg"
      >
        <p class="text-sm text-red-700">{{ error }}</p>
      </div>

      <!-- Success Message -->
      <div
        *ngIf="success"
        class="mb-4 p-3 bg-green-50 border border-green-200 rounded-lg"
      >
        <p class="text-sm text-green-700">{{ success }}</p>
      </div>

      <form [formGroup]="formReview">
        <!-- Star Rating -->
        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-700 mb-3">
            {{ "activities.rating" | translate }}
          </label>
          <div class="flex gap-2 justify-center">
            <ng-container *ngFor="let starIndex of getStarsArray()">
              <button
                type="button"
                (click)="setRating(starIndex + 1)"
                (mouseenter)="setHoverRating(starIndex + 1)"
                (mouseleave)="clearHoverRating()"
                [disabled]="isSubmitting"
                class="transition-transform duration-200 hover:scale-110 disabled:opacity-50"
              >
                <svg
                  [class]="
                    getStarState(starIndex, hoverRating > 0) === 'full'
                      ? 'w-10 h-10 text-yellow-400 fill-current'
                      : 'w-10 h-10 text-gray-300 fill-current'
                  "
                  viewBox="0 0 20 20"
                >
                  <path
                    d="M10 15l-5.878 3.09 1.123-6.545L.489 6.91l6.572-.955L10 0l2.939 5.955 6.572.955-4.756 4.635 1.123 6.545z"
                  />
                </svg>
              </button>
            </ng-container>
          </div>
          <p
            class="text-center text-sm text-gray-500 mt-2"
            *ngIf="formReview.get('rating')?.value > 0"
          >
            {{ formReview.get("rating")?.value }} / 5
            {{ "common.stars" | translate }}
          </p>
        </div>

        <!-- Comment -->
        <div class="mb-6">
          <label class="block text-sm font-semibold text-gray-700 mb-2">
            {{ "activities.comment" | translate }}
          </label>
          <textarea
            formControlName="comment"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#5675AC] focus:border-transparent resize-none disabled:bg-gray-100"
            rows="4"
            [placeholder]="'activities.commentPlaceholder' | translate"
            [disabled]="isSubmitting"
          >
          </textarea>
          <p class="text-xs text-gray-500 mt-1">
            {{ (formReview.get("comment")?.value || "").length }}/500
          </p>
        </div>
      </form>
    </div>

    <!-- Footer -->
    <div class="px-6 py-4 border-t border-gray-200 flex gap-3 justify-end">
      <button
        (click)="closeModal()"
        [disabled]="isSubmitting"
        class="px-4 py-2 rounded-lg border border-gray-300 text-gray-700 font-medium hover:bg-gray-50 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
      >
        {{ "common.cancel" | translate }}
      </button>
      <button
        (click)="submitReview()"
        [disabled]="formReview.get('rating')?.value === 0 || isSubmitting"
        [class]="
          formReview.get('rating')?.value === 0 || isSubmitting
            ? 'px-4 py-2 rounded-lg bg-gray-300 text-gray-500 font-medium cursor-not-allowed'
            : 'px-4 py-2 rounded-lg bg-[#5675AC] text-white font-medium hover:bg-[#4a5f8f] transition-colors'
        "
      >
        <span *ngIf="!isSubmitting">{{ "activities.update" | translate }}</span>
        <span *ngIf="isSubmitting">{{ "common.loading" | translate }}</span>
      </button>
    </div>
  </div>
</div>
