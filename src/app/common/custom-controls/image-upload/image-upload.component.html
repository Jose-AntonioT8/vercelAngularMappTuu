<div class="image-upload-container">
  <label *ngIf="label" class="block text-sm font-medium text-blue-900 mb-2">
    {{ label }}
  </label>
  
  <div class="relative">
    <!-- Vista previa de imagen -->
    <div class="w-full aspect-video bg-slate-100 rounded-lg overflow-hidden mb-3 border-2 border-dashed border-gray-300">
      <img 
        [src]="currentPreview" 
        class="w-full h-full object-cover"
        alt="Vista previa"
        onerror="this.src='https://via.placeholder.com/400x300?text=Error+al+cargar'"
      />
    </div>
    
    <!-- Botón de selección -->
    <label 
      class="flex items-center justify-center gap-2 w-full px-4 py-3 bg-brand-primary hover:bg-brand-secondary text-white font-medium rounded-lg cursor-pointer transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
      [class.opacity-50]="disabled"
      [class.cursor-not-allowed]="disabled"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
      </svg>
      <span>{{ selectedFile ? selectedFile.name : 'Seleccionar imagen' }}</span>
      <input 
        type="file" 
        accept="image/*"
        [disabled]="disabled"
        (change)="onFileSelected($event)"
        class="hidden"
      />
    </label>
    
    <p class="text-xs text-gray-500 mt-2 text-center">
      Tamaño máximo: 5MB. Formatos: JPG, PNG, GIF
    </p>
  </div>
  
  <span *ngIf="errorMessage && touched" class="text-red-500 text-sm mt-1 block">
    {{ errorMessage }}
  </span>
</div>
