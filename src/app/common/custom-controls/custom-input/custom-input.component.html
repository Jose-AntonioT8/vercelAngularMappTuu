<div class="custom-input-container">
  <label *ngIf="label" class="block text-sm font-medium text-blue-900 mb-1">
    {{ label }}
  </label>
  <input 
    [type]="type"
    [value]="value"
    [placeholder]="placeholder"
    [disabled]="disabled"
    (input)="onInput($event)"
    (blur)="onBlur()"
    class="w-full px-4 py-3 border border-gray-300 rounded-lg text-gray-700 bg-white input-shadow focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed"
  />
  <span *ngIf="errorMessage && touched" class="text-red-500 text-sm mt-1 block">
    {{ errorMessage }}
  </span>
</div>
