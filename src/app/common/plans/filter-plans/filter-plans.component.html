<form class="w-full max-h-[calc(100vh-150px)] overflow-y-auto rounded-3xl border border-slate-200 dark:border-slate-700 bg-white/95 dark:bg-slate-900 shadow-[0_12px_28px_rgba(15,23,42,0.12)] dark:shadow-none p-5 md:p-6 flex flex-col gap-1 backdrop-blur-sm dark:backdrop-blur-0">
  
  <div class="mb-4 border-b border-slate-200 dark:border-slate-700 pb-4">
    <h2 class="text-center text-xl md:text-2xl font-extrabold tracking-tight text-slate-800 dark:text-slate-100">{{ 'common.filters' | translate }}</h2>
  </div>
  
  <div class="mb-5">
    <h3 class="text-sm uppercase tracking-wide font-semibold text-slate-700 dark:text-slate-300 mb-2">{{ 'plans.filterActivitiesLabel' | translate }}</h3>
    
    <div>
            <select [(ngModel)]="activity" 
              name="activityTypeInput" 
              (change)="emitCurrentFilterState()" 
              class="w-full p-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-100 shadow-sm dark:shadow-none transition-all duration-200 focus:border-[#5675AC] focus:outline-none focus:ring-4 focus:ring-[#5675AC]/15">
        
        <option [ngValue]="null">{{ 'plans.filterAllActivities' | translate }}</option>
        
        <option *ngFor="let name of activitiesName" [value]="name">{{ name }}</option>

      </select>
    </div>
  </div>

  
  
  <div class="mb-6 rounded-2xl bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700 p-3">
    <h3 class="text-sm uppercase tracking-wide font-semibold text-slate-700 dark:text-slate-300 mb-1">{{ 'plans.filterRatingLabel' | translate }}</h3>
    <p class="text-xs text-slate-500 dark:text-slate-400 mb-3">{{ ratingMin }}/5</p>
    <div>
      <input type="range" 
             [(ngModel)]="ratingMin" 
             name="ratingMinInput" 
             (change)="emitCurrentFilterState()" 
             min="0" 
             max="5" 
             step="1" 
             class="w-full cursor-pointer accent-[#5675AC]">
    </div>
  </div>
  <button type="button" (click)="resetFilters()" class="mt-auto w-full p-3 bg-[#5675AC] text-white border-none rounded-xl cursor-pointer text-base font-semibold shadow-md shadow-[#5675AC]/30 dark:shadow-none transition-all duration-200 hover:bg-[#4a6399] hover:shadow-lg dark:hover:shadow-none">{{ 'plans.clear' | translate }}</button>

</form>
