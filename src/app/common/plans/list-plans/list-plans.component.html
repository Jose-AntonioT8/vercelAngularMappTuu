<ng-container *ngIf="{ list: plans$ | async, types: activity$ | async } as vm">
  
    <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 w-full">
      <app-card-plans
        *ngFor="let plan of vm.list" 
        [plan]="plan"
        [activity]="vm.types || []"> </app-card-plans>
    </section>
  
    <div *ngIf="vm.list?.length === 0" class="text-center py-8">
      <p class="text-gray-600">{{ 'plans.noPlans' | translate }}</p>
    </div>
  
  </ng-container>
