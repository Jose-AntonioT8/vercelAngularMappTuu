<div class="relative h-full w-full">
  
    <div #mapContainer class="h-full w-full z-0"></div>
  
    <div *ngIf="selectedPoint" 
         class="absolute bottom-4 left-4 right-4 z-[1000] md:bottom-8 md:left-1/2 md:w-full md:max-w-md md:-translate-x-1/2 animate-slide-up">
      
      <div class="bg-white rounded-xl shadow-2xl border border-gray-200 overflow-hidden flex relative min-h-[120px]">
  
        <div *ngIf="selectedPoint.image" class="w-1/3 min-w-[120px] relative bg-gray-100">
            <img [src]="selectedPoint.image" 
                 alt="Foto de {{ selectedPoint.title }}" 
                 class="absolute inset-0 w-full h-full object-cover h-full"
                 onerror="this.style.display='none'"> </div>
        <button (click)="closeCard()" 
                class="absolute top-2 right-2 z-20 p-1 bg-white/80 hover:bg-white rounded-full text-gray-500 shadow-sm transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
  
        <div class="flex-1 p-3 flex flex-col justify-between">
          
          <div>
            <h3 class="font-bold text-base text-gray-900 leading-tight pr-6 line-clamp-2">
                {{ selectedPoint.title }}
            </h3>
  
            <div class="flex items-center gap-3 mt-1">
                <div class="flex items-center">
                <svg class="w-4 h-4 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
                </svg>
                <span class="text-xs text-gray-600 font-semibold ml-1">
                    {{ selectedPoint.rating || 0 }}
                    </span>
                </div>
                <span class="text-xs font-bold" [class.text-green-600]="!selectedPoint.price || selectedPoint.price === 0" [class.text-gray-700]="selectedPoint.price && selectedPoint.price > 0">
                    {{ selectedPoint.price | price }}
                </span>
            </div>
  
            <div class="flex items-start mt-2 text-gray-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 mt-0.5 mr-1 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                <p class="text-xs font-medium leading-tight">
                    <span *ngIf="location">{{ location }}</span>
                    <span *ngIf="!location" class="italic animate-pulse">{{ 'messages.loading' | translate }}...</span>
                </p>
            </div>
          </div>
  
          <div class="flex justify-end mt-2">
            <a *ngIf="selectedPoint.link" 
               [routerLink]="selectedPoint.link"
               class="text-blue-600 hover:text-blue-800 text-xs font-bold uppercase tracking-wide">
              {{ 'dashboard.view' | translate }} &rarr;
            </a>
          </div>
  
        </div>
      </div>
    </div>
  </div>
