<app-header></app-header>

<main class="min-h-screen bg-slate-50 py-8 px-4">
  <section
    class="max-w-4xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8"
  >
    <h1 class="text-2xl md:text-3xl font-bold text-slate-900">
      {{ 'ia.title' | translate }}
    </h1>
    <p class="mt-2 text-slate-600">
      {{ 'ia.description' | translate }}
    </p>

    <div class="mt-6 space-y-3">
      <label for="ia-question" class="block text-sm font-medium text-slate-700"
        >{{ 'ia.question' | translate }}</label>
      <textarea
        id="ia-question"
        [(ngModel)]="question"
        [disabled]="isLoading"
        rows="5"
        [placeholder]="'ia.questionPlaceholder' | translate"
        class="w-full rounded-xl border border-slate-300 focus:border-brand-primary focus:ring-brand-primary resize-y p-3 text-slate-900"
      ></textarea>

      <button
        type="button"
        (click)="sendQuestion()"
        [disabled]="isLoading || !question.trim()"
        class="inline-flex items-center justify-center rounded-xl px-5 py-2.5 font-semibold text-white bg-brand-primary hover:bg-brand-secondary disabled:opacity-50 disabled:cursor-not-allowed"
      >
      {{ (isLoading ? 'ia.asking' : 'ia.ask') | translate }}      </button>
    </div>

    <p *ngIf="errorMessage" class="mt-4 text-sm text-red-600">
      {{ errorMessage }}
    </p>

    <article
      *ngIf="answer"
      appHighlight
      [appHighlight]="'#fff7ed'"
      [highlightDefault]="'#f8fafc'"
      class="mt-6 rounded-xl border border-slate-200 bg-slate-50 p-4 transition-colors duration-200"
    >
      <h2 class="text-sm font-semibold text-slate-800 mb-2">{{ 'ia.answer' | translate }}</h2>

      <div class="space-y-3 text-slate-700">
        <p
          *ngFor="let paragraph of answerParagraphs"
          class="leading-relaxed whitespace-pre-wrap"
        >
          {{ paragraph }}
        </p>

        <ul *ngIf="answerBullets.length" class="list-disc pl-5 space-y-1">
          <li *ngFor="let bullet of answerBullets" class="leading-relaxed">{{ bullet }}</li>
        </ul>

        <p
          *ngIf="!answerParagraphs.length && !answerBullets.length"
          class="leading-relaxed whitespace-pre-wrap"
        >
          {{ answer }}
        </p>
      </div>
    </article>
  </section>
</main>
