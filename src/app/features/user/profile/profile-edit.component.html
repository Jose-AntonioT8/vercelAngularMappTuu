<header class="bg-brand-primary p-4 flex items-center h-16 shadow-md">
  <button
    (click)="goBack()"
    class="text-white hover:text-gray-200 transition-colors"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="2.5"
      stroke="currentColor"
      class="w-7 h-7"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h17.5"
      />
    </svg>
  </button>
  <span class="ml-4 text-white font-semibold text-lg">
    {{ "profile.editProfile" | translate }}
  </span>
</header>

<main
  class="min-h-screen bg-gradient-to-br from-slate-200 via-slate-300/50 to-brand-muted/30 px-4 py-8 motion-safe:animate-[pageSoft_.42s_ease-out]"
>
  <section
    class="max-w-xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-200 ring-1 ring-black/5 p-6 md:p-8"
  >
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">
          {{ "profile.name" | translate }}
        </label>
        <input
          type="text"
          formControlName="name"
          class="w-full rounded-xl border border-slate-200 px-4 py-3 text-slate-700 focus:outline-none focus:ring-2 focus:ring-[#5675AC]/30 focus:border-[#5675AC]"
          [placeholder]="'auth.signup.namePlaceholder' | translate"
        />
      </div>

      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-2">
          {{ "profile.email" | translate }}
        </label>
        <input
          type="email"
          formControlName="email"
          class="w-full rounded-xl border border-slate-200 px-4 py-3 text-slate-700 focus:outline-none focus:ring-2 focus:ring-[#5675AC]/30 focus:border-[#5675AC]"
          [placeholder]="'auth.login.emailPlaceholder' | translate"
        />
      </div>

      <div
        *ngIf="error"
        class="p-3 rounded-lg text-sm text-red-700 bg-red-50 border border-red-100"
      >
        {{ error }}
      </div>

      <div
        *ngIf="success"
        class="p-3 rounded-lg text-sm text-green-700 bg-green-50 border border-green-100"
      >
        {{ success }}
      </div>

      <div class="flex gap-3 pt-2">
        <button
          type="button"
          (click)="goBack()"
          class="flex-1 rounded-xl border border-slate-200 px-4 py-3 text-slate-600 font-semibold hover:bg-slate-50 transition-colors"
        >
          {{ "common.cancel" | translate }}
        </button>
        <button
          type="submit"
          [disabled]="isSaving"
          class="flex-1 rounded-xl bg-[#5675AC] px-4 py-3 text-white font-semibold hover:bg-[#4a6399] transition-colors disabled:opacity-60 disabled:cursor-not-allowed"
        >
          @if (isSaving) {
            {{ "messages.loading" | translate }}
          } @else {
            {{ "activities.save" | translate }}
          }
        </button>
      </div>
    </form>
  </section>
</main>
