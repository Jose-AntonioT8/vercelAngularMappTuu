<header class="bg-brand-primary px-4 flex justify-between items-center h-16 sticky top-0 z-50 shadow-md">
  
  <div class="flex items-center gap-4">
    <a routerLink="/dashboard" [attr.aria-label]="'common.back' | translate" class="text-white hover:text-gray-200 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-8 h-8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h17.5"/>
      </svg>
    </a>
    <div class="text-white font-semibold text-lg">{{ 'activityTypes.createTitle' | translate }}</div>
  </div>

  <div class="relative z-50">
    <app-language-selector></app-language-selector>
  </div>

</header>

<main class="flex-grow flex justify-center items-start pt-10 px-4 pb-10 min-h-screen bg-gradient-to-br from-slate-200 via-slate-300/50 to-brand-muted/30">
  
  <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden border border-slate-300 ring-1 ring-black/10 p-8">
    
    <h1 class="text-2xl font-bold mb-8 text-center" style="color: #5675AC;">
      {{ 'activityTypes.createTitle' | translate }}
    </h1>

    <form [formGroup]="formActivityCreation" class="space-y-8" (ngSubmit)="onCreate()">
      
      <div class="relative group">
        <label for="name" class="absolute -top-2.5 left-3 bg-white px-2 text-xs font-bold uppercase tracking-wider" style="color: #5675AC;">
          {{ 'activityTypes.name' | translate }}
        </label>
        <input type="text" formControlName="name" id="name" 
               [placeholder]="'activityTypes.namePlaceholder' | translate"
               class="w-full bg-white border-2 border-slate-100 rounded-xl px-4 py-4 text-lg font-medium text-slate-800 placeholder-slate-300 focus:outline-none focus:ring-4 transition-all"
               style="border-color: transparent; outline: none;" 
               [style.borderColor]="'#e2e8f0'"
               onfocus="this.style.borderColor='#5675AC'; this.style.boxShadow='0 0 0 4px rgba(86, 117, 172, 0.1)'"
               onblur="this.style.borderColor='#e2e8f0'; this.style.boxShadow='none'" />
        
        <span *ngIf="formActivityCreation.controls.name.touched && formActivityCreation.controls.name.errors" class="text-red-500 text-xs mt-1 ml-1 block animate-pulse">
          {{ getError('name') }}
        </span>
      </div>

      <div class="relative group">
        <label for="description" class="absolute -top-2.5 left-3 bg-white px-2 text-xs font-bold uppercase tracking-wider" style="color: #5675AC;">
          {{ 'activityTypes.description' | translate }}
        </label>
        <input type="text" formControlName="description" id="description" 
               [placeholder]="'activityTypes.descriptionPlaceholder' | translate"
               class="w-full bg-white border-2 border-slate-100 rounded-xl px-4 py-4 text-lg font-medium text-slate-800 placeholder-slate-300 focus:outline-none focus:ring-4 transition-all"
               style="border-color: transparent; outline: none;" 
               [style.borderColor]="'#e2e8f0'"
               onfocus="this.style.borderColor='#5675AC'; this.style.boxShadow='0 0 0 4px rgba(86, 117, 172, 0.1)'"
               onblur="this.style.borderColor='#e2e8f0'; this.style.boxShadow='none'" />
        
        <span *ngIf="formActivityCreation.controls.description.touched && formActivityCreation.controls.description.errors" class="text-red-500 text-xs mt-1 ml-1 block animate-pulse">
          {{ getError('description') }}
        </span>
      </div>

      <div class="relative group">
        <label for="color" class="block text-xs font-bold uppercase tracking-wider mb-2 ml-1" style="color: #5675AC;">
          {{ 'activityTypes.color' | translate }}
        </label>
        <div class="flex items-center gap-4 bg-slate-50 p-2 rounded-xl border border-slate-200">
           <input type="color" formControlName="color" id="color" 
                  class="h-12 w-full cursor-pointer rounded-lg border-0 p-1 bg-white shadow-sm transition-transform hover:scale-[1.01]" />
        </div>
        
        <span *ngIf="formActivityCreation.controls.color.touched && formActivityCreation.controls.color.errors" class="text-red-500 text-xs mt-1 ml-1 block animate-pulse">
          {{ getError('color') }}
        </span>
      </div>

      <button type="submit" 
              class="group w-full relative text-white font-bold py-4 rounded-xl text-lg shadow-xl transition-all transform hover:-translate-y-0.5 active:scale-[0.99] overflow-hidden mt-6"
              style="background-color: #5675AC; box-shadow: 0 10px 15px -3px rgba(86, 117, 172, 0.3);">
        
        <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"></div>
        
        <span class="relative z-10 flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
               <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
            </svg>
            {{ 'activityTypes.create' | translate }}
        </span>
      </button>

    </form>

    <div *ngIf="error" id="errorOnCreate" class="mt-6 p-3 bg-red-50 text-red-600 text-sm font-medium rounded-lg text-center border border-red-100 flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-5a.75.75 0 01.75.75v4.5a.75.75 0 01-1.5 0v-4.5A.75.75 0 0110 5zm0 10a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" /></svg>
        {{ error }}
    </div>

  </div>
</main>
