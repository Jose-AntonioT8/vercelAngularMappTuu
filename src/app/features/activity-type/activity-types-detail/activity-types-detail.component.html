<header class="text-white px-4 flex justify-between items-center h-16 sticky top-0 z-50 shadow-md" style="background-color: #5675AC;">
    
    <div class="flex items-center gap-4">
        <button (click)="goBack()" class="flex items-center justify-center w-10 h-10 rounded-full transition-colors hover:bg-white/20">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
            </svg>
        </button>
        <h1 class="text-xl font-bold">{{ 'activityTypes.title' | translate }}</h1>
    </div>

    <div class="relative z-50">
        <app-language-selector></app-language-selector>
    </div>

</header>

<div class="min-h-screen bg-gradient-to-br from-slate-200 via-slate-300/50 to-brand-muted/30 p-4 pt-10 flex justify-center items-start">
    
    <div class="bg-white w-full max-w-3xl rounded-3xl shadow-2xl overflow-hidden border border-slate-300/50">
        
        <div class="p-8">
            
            <div class="flex justify-end mb-4">
                <app-options-activity-types></app-options-activity-types>
            </div>

            <div class="flex flex-col sm:flex-row items-center sm:items-start gap-6 mb-8 pb-8 border-b border-slate-100">
                
                <div class="w-24 h-24 rounded-full shadow-lg ring-4 ring-slate-50 flex-shrink-0 transition-transform hover:scale-105" 
                     [style.background-color]="activityType?.color || '#ccc'">
                </div>

                <div class="text-center sm:text-left mt-2">
                    <h2 class="text-3xl sm:text-4xl font-extrabold text-slate-800 mb-2">
                        {{ activityType?.name }}
                    </h2>
                    <span class="inline-block px-3 py-1 bg-slate-100 text-[#5675AC] text-xs font-bold uppercase tracking-widest rounded-full">
                        {{ 'activityTypes.type' | translate }}
                    </span>
                </div>
            </div>

            <div class="bg-slate-50/80 rounded-2xl p-6 border border-slate-100">
                <h3 class="flex items-center gap-2 text-sm font-bold text-[#5675AC] uppercase tracking-wider mb-4">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path>
                    </svg>
                    {{ 'activityTypes.description' | translate }}
                </h3>
                
                <p class="text-slate-700 leading-relaxed text-lg">
                    {{ activityType?.description || ('activityTypes.descriptionPlaceholder' | translate) }}
                </p>
            </div>

        </div>
    </div>
</div>
