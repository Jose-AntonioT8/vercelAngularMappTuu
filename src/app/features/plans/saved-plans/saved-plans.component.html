<header class="sticky top-0 z-50">
  <app-header></app-header>
</header>

<div class="motion-safe:animate-[pageEnter_.32s_ease-out]">
<div class="bg-gradient-to-r from-brand-primary to-brand-secondary shadow-lg py-5 px-4">
  <div class="max-w-5xl mx-auto">
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3">
      <div
        class="flex items-center bg-white dark:bg-slate-100 rounded-full px-5 py-3 shadow-xl focus-within:ring-4 focus-within:ring-white/40 transition-all w-full"
      >
        <svg
          class="w-5 h-5 text-gray-400 dark:text-slate-500 mr-3"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
        <input
          type="search"
          [placeholder]="'activities.searchPlaceholder' | translate"
          class="bg-transparent border-none outline-none w-full text-sm text-gray-700 dark:text-slate-800 placeholder-gray-400 dark:placeholder-slate-500"
        />
      </div>
      <button
        (click)="goCreatePlan()"
        class="shrink-0 px-5 py-3 rounded-full bg-white/95 text-brand-primary hover:bg-white transition-colors text-sm font-semibold shadow-lg"
      >
        {{ "dashboard.createPlans" | translate }}
      </button>
    </div>
  </div>
</div>

<section
  class="pb-5 block xl:grid xl:grid-cols-[20%_80%] xl:items-start w-full min-h-[80vh] relative"
>
  <button
    (click)="toggleFilter()"
    class="xl:hidden fixed bottom-4 right-4 z-40 bg-[#5675AC] text-white px-4 py-2 rounded-full shadow-lg flex items-center gap-2 hover:bg-[#4a6399] transition-colors"
  >
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"
      ></path>
    </svg>
    {{ "plans.filters" | translate }}
  </button>

  <div
    class="xl:hidden fixed inset-0 bg-black/50 z-30 transition-opacity"
    [class.opacity-0]="!isFilterOpen"
    [class.pointer-events-none]="!isFilterOpen"
    [class.opacity-100]="isFilterOpen"
    (click)="closeFilter()"
  ></div>

  <div class="hidden xl:block"></div>

  <section class="p-2.5 xl:p-6 xl:px-8 w-full">
    <ng-container
      *ngIf="{ list: plans$ | async, types: activity$ | async } as vm"
    >
      <section
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 w-full"
      >
        <app-card-plans
          *ngFor="let plan of vm.list"
          [plan]="plan"
          [activity]="vm.types || []"
        >
        </app-card-plans>
      </section>

      <div *ngIf="vm.list?.length === 0" class="text-center py-8">
        <p class="text-gray-600">{{ "plans.noPlans" | translate }}</p>
      </div>
    </ng-container>
  </section>

  <div
    class="fixed xl:fixed xl:top-[180px] xl:left-0 left-0 top-0 h-full xl:h-[calc(100vh-180px)] w-80 xl:w-[20%] max-h-screen xl:max-h-none overflow-y-auto z-40 xl:z-auto transform xl:translate-x-0 transition-transform duration-300 ease-in-out bg-white/85 dark:bg-slate-950 xl:bg-transparent backdrop-blur-md dark:backdrop-blur-0 xl:backdrop-blur-0 border-r border-slate-200/70 dark:border-slate-800/40 xl:border-r-0"
    [class.-translate-x-full]="!isFilterOpen"
    [class.translate-x-0]="isFilterOpen"
    (click)="$event.stopPropagation()"
  >
    <div
      class="xl:hidden flex justify-between items-center p-4 border-b border-slate-200/80 dark:border-slate-700 bg-gradient-to-r from-[#dff0ff] to-[#cfe8ff] dark:from-slate-800 dark:to-slate-700"
    >
      <h2 class="text-xl font-extrabold tracking-tight text-slate-800 dark:text-slate-100">{{ "plans.filters" | translate }}</h2>
      <button (click)="closeFilter()" class="text-gray-600 hover:text-gray-800 dark:text-slate-300 dark:hover:text-slate-100">
        <svg
          class="w-6 h-6"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </button>
    </div>
    <div class="px-3 py-3 xl:px-4 xl:py-2">
      <app-filter-plans></app-filter-plans>
    </div>
  </div>
</section>

</div>
