<header class="sticky top-0 z-50 text-white p-4 flex items-center justify-between shadow-md" style="background-color: #5675AC;">
  <div class="flex items-center gap-4">
    <a routerLink="/plansList" class="flex items-center justify-center w-10 h-10 rounded-full transition-colors hover:bg-white/30 bg-white/20 text-white cursor-pointer">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
      </svg>
    </a>
    <h1 class="text-xl font-bold tracking-tight">{{ 'plans.updateTitle' | translate }}</h1>
  </div>
  <div class="relative z-50">
    <app-language-selector></app-language-selector>
</div>
</header>

<div class="bg-gray-50 min-h-[calc(100vh-73px)] flex justify-center items-start pt-8 pb-12 px-4 sm:px-6 motion-safe:animate-[pageSoft_.42s_ease-out]">
  
  <div class="bg-white w-full max-w-5xl rounded-3xl shadow-xl overflow-hidden border border-white">
    
    <form [formGroup]="formPlanUpdate" (submit)="onUpdate()" class="flex flex-col">
      
      <div class="grid grid-cols-1 lg:grid-cols-5 h-full">
        
        <div class="lg:col-span-2 relative bg-slate-100 min-h-[350px] lg:min-h-full group overflow-hidden">
          <img [src]="currentImage || 'https://picsum.photos/800/600'" 
               class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
               alt="Plan Preview"
               onerror="this.src='https://picsum.photos/800/600'">
          
          <div class="absolute bottom-4 left-4 right-4">
            <div class="bg-white/90 backdrop-blur-md p-3 rounded-2xl border border-white/40 shadow-lg">
              <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1 block pl-1">{{ 'plans.imageSourceURL' | translate }}</label>
              <div class="flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4 shrink-0" style="color: #5675AC;">
                  <path fill-rule="evenodd" d="M1 5.25A2.25 2.25 0 013.25 3h13.5A2.25 2.25 0 0119 5.25v9.5A2.25 2.25 0 0116.75 17H3.25A2.25 2.25 0 011 14.75v-9.5zm1.5 5.81v3.69c0 .414.336.75.75.75h13.5a.75.75 0 00.75-.75v-2.69l-2.22-2.219a.75.75 0 00-1.06 0l-1.91 1.909.47.47a.75.75 0 11-1.06 1.06L6.53 8.091a.75.75 0 00-1.06 0l-2.97 2.97zM12 7a1 1 0 11-2 0 1 1 0 012 0z" clip-rule="evenodd" />
                </svg>
                  <input type="text" formControlName="imageRef" 
                    class="w-full bg-transparent text-sm text-slate-800 font-medium focus:outline-none placeholder-slate-400"
                    [placeholder]="'plans.pasteURL' | translate">
              </div>
            </div>
          </div>
        </div>

        <div class="lg:col-span-3 p-6 md:p-10 flex flex-col gap-8">
          
          <div class="relative group">
            <label class="absolute -top-2.5 left-3 bg-white px-2 text-xs font-bold uppercase tracking-wider" style="color: #5675AC;">{{ 'plans.planName' | translate }}</label>
            <input type="text" formControlName="name" 
                   class="w-full bg-white border-2 rounded-xl px-4 py-4 text-xl font-bold text-slate-800 placeholder-slate-300 focus:outline-none focus:border-[#5675AC] focus:ring-4 focus:ring-[#5675AC]/10 transition-all border-slate-100"
                   [placeholder]="'plans.planNamePlaceholder' | translate">
          </div>

          <div class="bg-slate-50/50 rounded-2xl p-6">
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 ml-1">{{ 'plans.aboutThisPlan' | translate }}</label>
            <textarea formControlName="description" rows="6" 
                      class="w-full bg-white border border-slate-200 rounded-2xl p-5 text-slate-700 leading-relaxed outline-none resize-none transition-all shadow-sm focus:border-[#5675AC] focus:ring-4 focus:ring-[#5675AC]/10"
                      [placeholder]="'plans.describeYourPlan' | translate"></textarea>
          </div>

          <div class="bg-slate-50/50 rounded-2xl p-6">
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 ml-1">{{ 'plans.selectActivities' | translate }}</label>
            <div class="border border-slate-200 rounded-xl bg-white overflow-y-auto max-h-48 shadow-sm">
              <div *ngFor="let activity of activities" 
                   class="flex items-center p-3 hover:bg-slate-50 cursor-pointer transition-colors border-b border-slate-100 last:border-b-0"
                   (click)="toggleActivitySelection(activity.name)">
                <input type="checkbox" 
                       [id]="'activity-' + activity.id"
                       [value]="activity.name"
                       [checked]="isSelected(activity.name)"
                       class="h-4 w-4 rounded border-gray-300 focus:ring-2 focus:ring-[#5675AC] cursor-pointer"
                       style="accent-color: #5675AC;"
                       (change)="toggleActivitySelection(activity.name)">
                <label [for]="'activity-' + activity.id" class="ml-3 text-slate-700 flex-grow cursor-pointer font-medium">
                  {{ activity.name }}
                </label>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-3 bg-slate-50/50 rounded-xl p-4">
            <input type="checkbox" 
                   formControlName="visibility" 
                   id="visibility"
                   class="h-5 w-5 rounded border-gray-300 focus:ring-2 focus:ring-[#5675AC] cursor-pointer"
                   style="accent-color: #5675AC;">
            <label for="visibility" class="text-sm font-bold text-slate-700 cursor-pointer">
              {{ 'plans.visibility' | translate }}
            </label>
          </div>

        </div>
      </div>

      <div class="px-6 md:px-10 py-8 bg-slate-50/50 border-t border-slate-100">
        
        <button type="submit" 
                [disabled]="formPlanUpdate.invalid"
                class="w-full relative bg-[#5675AC] text-white font-bold py-4 rounded-xl text-lg shadow-xl transition-all transform hover:-translate-y-0.5 hover:shadow-2xl active:scale-[0.99] disabled:opacity-50 disabled:cursor-not-allowed disabled:shadow-none">
          
          <span class="flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
               <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
            </svg>
            {{ 'plans.update' | translate }}
          </span>
        </button>
        
        <div *ngIf="error" class="mt-4 p-3 bg-red-50 text-red-600 text-sm font-medium rounded-lg text-center border border-red-100 flex items-center justify-center gap-2 animate-pulse">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-5a.75.75 0 01.75.75v4.5a.75.75 0 01-1.5 0v-4.5A.75.75 0 0110 5zm0 10a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd" />
            </svg>
            {{ error }}
        </div>
        <div *ngIf="success" class="mt-4 p-3 bg-green-50 text-green-700 text-sm font-medium rounded-lg text-center border border-green-100 flex items-center justify-center gap-2">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-4 h-4">
              <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
            </svg>
            {{ success }}
        </div>

      </div>

    </form>
  </div>
</div>
